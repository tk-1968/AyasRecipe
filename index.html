<script>
let baseData=[];let records=[];let materialMaster=[];let currentId=null;let currentTab='ja';
const STORAGE_KEY='aya_recipe_editor_v4';
const MATERIAL_MASTER_KEY='aya_recipe_material_master_v6';
const $=sel=>document.querySelector(sel);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clone=obj=>JSON.parse(JSON.stringify(obj));
function init(){try{baseData=clone(window.RECIPE_DATA||[]);const saved=localStorage.getItem(STORAGE_KEY);records=saved?JSON.parse(saved):clone(baseData);loadMaterialMaster();bind();renderList();if(records.length)openRecord(records[0].id,false);else showEmpty();}catch(e){console.error(e);$('#summary').textContent='読み込みエラー';$('#workspace').innerHTML='<div class="empty">読み込みエラー: '+esc(e.message)+'</div>';}}
function bind(){$('#q').addEventListener('input',renderList);$('#exportJson').addEventListener('click',exportJson);$('#exportCsv').addEventListener('click',exportCsv);$('#exportPdfAll').addEventListener('click',()=>{saveCurrent(false);printAllPdf();});$('#newBtn').addEventListener('click',newRecipe);$('#materialMasterBtn').addEventListener('click',openMaterialMaster);$('#normalizeBtn').addEventListener('click',normalizeCurrentRecipeMaterials);$('#resetBtn').addEventListener('click',()=>{if(confirm('ブラウザ保存データを初期化しますか？')){localStorage.removeItem(STORAGE_KEY);records=clone(baseData);currentId=null;renderList();if(records.length)openRecord(records[0].id,false);else showEmpty();}});bindMaterialModal();}
function showEmpty(){$('#workspace').innerHTML='<div class="empty">データがありません。「新規レシピ」から追加できます。</div>';}
function renderList(){const q=$('#q').value.trim().toLowerCase();const list=$('#list');list.innerHTML='';let hits=0;const matchedMasters=q?findMatchingMasters(q):[];records.forEach(r=>{const text=[r.no,r.title_ja,r.title_fr,r.category,r.ocr,r.ja_text,r.process_ja,r.process_fr,(r.ingredients||[]).map(x=>Object.values(x).join(' ')).join(' ')].join(' ').toLowerCase();const materialHit=q&&recordHasMaster(r,matchedMasters);if(q&&!text.includes(q)&&!materialHit)return;hits++;const div=document.createElement('div');div.className='item'+(r.id===currentId?' active':'');const note=materialHit?'<div class="hitnote">材料マスタ一致</div>':'';div.innerHTML=`<div class="item-title">${String(r.no).padStart(3,'0')} ${esc(r.title_ja||r.title_fr||'名称未設定')}</div><div class="item-sub">${esc(r.title_fr||'')}｜${esc(r.category||'未分類')}</div>${note}`;div.onclick=()=>openRecord(r.id,true);list.appendChild(div);});$('#summary').textContent=`表示 ${hits} / 全 ${records.length} 件${q&&matchedMasters.length?' / 材料マスタ一致 '+matchedMasters.length+' 件':''}`;}
function rec(){return records.find(x=>x.id===currentId);}
function openRecord(id,autosave=true){if(autosave)saveCurrent(false);currentId=id;currentTab='ja';renderList();renderEditor();}
function renderEditor(){const r=rec();if(!r){showEmpty();return;}$('#workspace').innerHTML=`<div class="panel"><div class="panel-head"><div><b>${String(r.no).padStart(3,'0')} ${esc(r.title_ja||r.title_fr||'名称未設定')}</b><div class="item-sub">${esc(r.title_fr||'')}</div></div><div class="toolbar"><button class="btn primary" id="saveCurrentBtn">保存</button><button class="btn" id="printOneBtn">このレシピをPDF出力</button><button class="btn" id="addIngredientBtn">材料行追加</button></div></div><div class="split"><div class="image-pane"><div id="dropzone" class="dropzone">画像をここにドラッグ＆ドロップ、またはクリックして追加/差し替え<input id="imageFile" type="file" accept="image/*" style="display:none"></div><img id="recipeImage" src="${esc(r.image||'')}" alt="recipe image" onerror="this.style.display='none'"><div class="notice">左の画像を見ながら右側の値を修正してください。保存するとブラウザ内に保持されます。新規画像はブラウザ保存のため、最終的にはJSON書出でバックアップしてください。</div><details><summary>OCR原文を見る</summary><pre class="preview">${esc(r.ocr||'')}</pre></details></div><div class="form-pane"><div class="tabs"><button class="tab" data-tab="ja">日本語</button><button class="tab" data-tab="fr">フランス語</button><button class="tab" data-tab="data">レシピデータ</button></div><div id="tabBody"></div></div></div></div>`;$('#saveCurrentBtn').onclick=()=>saveCurrent(true);$('#printOneBtn').onclick=()=>{saveCurrent(false);printOnePdf(r);};$('#addIngredientBtn').onclick=addIngredient;document.querySelectorAll('.tab').forEach(b=>{b.onclick=()=>{saveCurrent(false);currentTab=b.dataset.tab;renderTab();};});setupDropzone();renderTab();}
function setupDropzone(){const dz=$('#dropzone'), file=$('#imageFile');if(!dz||!file)return;dz.onclick=()=>file.click();['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));dz.addEventListener('drop',e=>{const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)loadImageFile(f);});file.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)loadImageFile(f);});}
function loadImageFile(f){if(!f.type.startsWith('image/')){alert('画像ファイルを指定してください');return;}const reader=new FileReader();reader.onload=()=>{const r=rec();if(!r)return;r.image=reader.result;r.original=f.name;const img=$('#recipeImage');img.src=r.image;img.style.display='block';saveCurrent(false);alert('画像を追加/差し替えました');};reader.readAsDataURL(f);}
function renderTab(){const r=rec();if(!r)return;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));const body=$('#tabBody');if(currentTab==='ja'){body.innerHTML=`<div class="grid3"><div class="field"><label>タイトル（日本語）</label><input id="title_ja" type="text" value="${esc(r.title_ja)}"></div><div class="field"><label>タイトル（フランス語）</label><input id="title_fr" type="text" value="${esc(r.title_fr)}"></div><div class="field"><label>カテゴリ</label><input id="category" type="text" value="${esc(r.category)}"></div></div><div class="field"><label>作り方・説明（日本語）</label><textarea id="process_ja">${esc(r.process_ja||r.ja_text||'')}</textarea></div><h3>日本語レシピ表示</h3><div class="preview">${esc(formatJa(r))}</div>`;}else if(currentTab==='fr'){body.innerHTML=`<div class="grid2"><div class="field"><label>Nom de la recette / タイトル（フランス語）</label><input id="title_fr" type="text" value="${esc(r.title_fr)}"></div><div class="field"><label>Titre japonais / タイトル（日本語）</label><input id="title_ja" type="text" value="${esc(r.title_ja)}"></div></div><div class="field"><label>Procédé / 作り方（フランス語）</label><textarea id="process_fr">${esc(r.process_fr||r.ocr||'')}</textarea></div><h3>Affichage français</h3><div class="preview">${esc(formatFr(r))}</div>`;}else{body.innerHTML=`<div class="notice">材料・基準量をここで修正します。基準総量と作りたい量を入力すると、倍率と必要量を自動計算します。</div><div class="ingredient-search-help">上部検索欄で「レモン」「citron」「生クリーム」などを入力すると、材料名・材料マスタの別名まで含めて検索します。</div>${simulationBox(r)}${ingredientTable(r)}<div class="grid2" style="margin-top:10px"><div class="field"><label>メモ</label><textarea id="memo">${esc(r.memo||'')}</textarea></div><div class="field"><label>JSONプレビュー</label><textarea readonly>${esc(JSON.stringify(r,null,2))}</textarea></div></div>`;bindSimulationInputs();}}

function toNum(v){if(v===null||v===undefined)return NaN;const s=String(v).replace(',', '.').replace(/[^0-9.\-]/g,'');return s?Number(s):NaN;}
function fmtNum(n){if(!isFinite(n))return '';return Math.round(n*10)/10;}
function inferBaseTotal(r){
  const explicit=toNum(r.base_total); if(isFinite(explicit)&&explicit>0) return explicit;
  const arr=r.ingredients||[];
  for(const x of arr){
    const txt=((x.section||'')+' '+(x.name_ja||'')+' '+(x.name_fr||'')).toLowerCase();
    const q=toNum(x.qty);
    if(isFinite(q)&&q>0&&(txt.includes('合計')||txt.includes('total')||txt.includes('poids'))) return q;
  }
  const sum=arr.filter(x=>!(((x.section||'')+' '+(x.name_ja||'')+' '+(x.name_fr||'')).toLowerCase().match(/合計|total|poids/))).reduce((a,x)=>{const q=toNum(x.qty);return a+(isFinite(q)?q:0);},0);
  return sum>0?sum:'';
}
function simulationBox(r){
  const inferred=inferBaseTotal(r);
  if(!r.base_total && inferred) r.base_total=String(inferred);
  const baseNum=toNum(r.base_total||inferred||'');
  const targetNum=toNum(r.target_total||'');
  let multNum=toNum(r.multiplier||'');
  if((!isFinite(multNum)||multNum<=0) && isFinite(targetNum)&&targetNum>0&&isFinite(baseNum)&&baseNum>0){
    multNum=targetNum/baseNum;
    r.multiplier=fmtNum(multNum);
  }
  if(!isFinite(multNum)||multNum<=0) multNum=1;
  return `<div class="simbox"><div class="field"><label>基準総量(g)</label><input id="base_total" type="number" step="0.01" value="${esc(r.base_total||inferred||'')}" placeholder="例：780"></div><div class="field"><label>作りたい量(g)</label><input id="target_total" type="number" step="0.01" value="${esc(r.target_total||'')}" placeholder="例：2000"></div><div class="field"><label>倍率</label><input id="multiplier" type="number" step="0.0001" value="${esc(r.multiplier||fmtNum(multNum))}" placeholder="例：2"></div><div class="field"><label>計算</label><div class="calc">必要量 = 基準量 × 倍率<br>作りたい量 = 基準総量 × 倍率</div></div></div>`;
}
function getMultiplier(r){
  const m=toNum(r.multiplier);
  if(isFinite(m)&&m>0)return m;
  const b=toNum(r.base_total||inferBaseTotal(r));
  const t=toNum(r.target_total);
  if(isFinite(t)&&t>0&&isFinite(b)&&b>0)return t/b;
  return 1;
}
function calcNeed(x,r){
  const q=toNum(x.qty); if(!isFinite(q))return '';
  return fmtNum(q*getMultiplier(r));
}
function bindSimulationInputs(){
  const baseEl=document.getElementById('base_total');
  const targetEl=document.getElementById('target_total');
  const multEl=document.getElementById('multiplier');
  const r=rec();
  if(!r)return;
  function persistNoRender(){
    if(baseEl)r.base_total=baseEl.value;
    if(targetEl)r.target_total=targetEl.value;
    if(multEl)r.multiplier=multEl.value;
    localStorage.setItem(STORAGE_KEY,JSON.stringify(records));
    updateCalculatedAmounts();
  }
  if(baseEl)baseEl.addEventListener('input',()=>{
    const b=toNum(baseEl.value);
    const t=toNum(targetEl&&targetEl.value);
    const m=toNum(multEl&&multEl.value);
    if(isFinite(t)&&t>0&&isFinite(b)&&b>0&&multEl) multEl.value=fmtNum(t/b);
    else if(isFinite(m)&&m>0&&isFinite(b)&&b>0&&targetEl) targetEl.value=fmtNum(b*m);
    persistNoRender();
  });
  if(targetEl)targetEl.addEventListener('input',()=>{
    const b=toNum(baseEl&&baseEl.value);
    const t=toNum(targetEl.value);
    if(isFinite(t)&&t>0&&isFinite(b)&&b>0&&multEl) multEl.value=fmtNum(t/b);
    persistNoRender();
  });
  if(multEl)multEl.addEventListener('input',()=>{
    const b=toNum(baseEl&&baseEl.value);
    const m=toNum(multEl.value);
    if(isFinite(m)&&m>0&&isFinite(b)&&b>0&&targetEl) targetEl.value=fmtNum(b*m);
    persistNoRender();
  });
}
function updateCalculatedAmounts(){
  const r=rec(); if(!r)return;
  document.querySelectorAll('[data-need-i]').forEach(el=>{
    const i=+el.dataset.needI;
    if(r.ingredients&&r.ingredients[i]) el.value=calcNeed(r.ingredients[i],r);
  });
}
function ingredientTable(r){const arr=r.ingredients||[];let trs=arr.map((x,i)=>`<tr class="${(x.status==='OK候補'||x.status==='OK')?'status-ok':x.status==='不明'?'status-bad':'status-warn'}"><td>${i+1}<br><button class="btn small danger" onclick="delIngredient(${i})">削除</button></td><td><input data-i="${i}" data-k="section" value="${esc(x.section)}"></td><td><input data-i="${i}" data-k="name_ja" value="${esc(x.name_ja)}"><textarea data-i="${i}" data-k="name_fr">${esc(x.name_fr)}</textarea></td><td><input data-i="${i}" data-k="qty" value="${esc(x.qty)}"></td><td><input data-i="${i}" data-k="unit" value="${esc(x.unit)}"></td><td><input class="readonly" readonly data-need-i="${i}" value="${esc(calcNeed(x,r))}"></td><td><select data-i="${i}" data-k="status"><option ${sel(x.status,'OK候補')}>OK候補</option><option ${sel(x.status,'OK')}>OK</option><option ${sel(x.status,'要確認')}>要確認</option><option ${sel(x.status,'不明')}>不明</option></select></td><td><textarea data-i="${i}" data-k="ocr_line">${esc(x.ocr_line)}</textarea></td><td><textarea data-i="${i}" data-k="memo">${esc(x.memo)}</textarea></td><td><button class="btn small" onclick="applyMasterToIngredient(${i})">適用</button><div class="muted">${esc(masterLabelForIngredient(x)||'未一致')}</div></td></tr>`).join('');if(!trs)trs='<tr><td colspan="10" class="muted">材料行がありません。「材料行追加」を押してください。</td></tr>';return `<table class="ingredients"><thead><tr><th>No</th><th>区分</th><th>材料JP / FR</th><th>基準量</th><th>単位</th><th>必要量</th><th>確認</th><th>OCR該当行</th><th>メモ</th><th>マスタ</th></tr></thead><tbody>${trs}</tbody></table>`;}
function sel(a,b){return a===b?'selected':'';}
function saveCurrent(show=false){const r=rec();if(!r)return;['title_ja','title_fr','category','process_ja','process_fr','memo','base_total','target_total','multiplier'].forEach(id=>{const el=document.getElementById(id);if(el)r[id]=el.value;});document.querySelectorAll('[data-i][data-k]').forEach(el=>{const i=+el.dataset.i,k=el.dataset.k;if(r.ingredients&&r.ingredients[i])r.ingredients[i][k]=el.value;});localStorage.setItem(STORAGE_KEY,JSON.stringify(records));renderList();if(show)alert('保存しました');}
function addIngredient(){saveCurrent(false);const r=rec();r.ingredients=r.ingredients||[];r.ingredients.push({section:'材料',name_ja:'',name_fr:'',qty:'',unit:'g',ocr_line:'',status:'要確認',memo:''});currentTab='data';renderTab();}
function delIngredient(i){saveCurrent(false);const r=rec();if(!r)return;r.ingredients.splice(i,1);renderTab();}
function newRecipe(){saveCurrent(false);const nextNo=records.reduce((m,r)=>Math.max(m,Number(r.no)||0),0)+1;const nextId=records.reduce((m,r)=>Math.max(m,Number(r.id)||0),0)+1;const r={id:nextId,no:nextNo,image:'',original:'',title_ja:'新規レシピ',title_fr:'Nouvelle recette',category:'未分類',ocr:'',ja_text:'',process_ja:'',process_fr:'',memo:'',base_total:'',target_total:'',multiplier:'1',ingredients:[]};records.push(r);currentId=r.id;localStorage.setItem(STORAGE_KEY,JSON.stringify(records));renderList();renderEditor();alert('新規レシピを追加しました。左側に画像をドラッグ＆ドロップできます。');}
function formatJa(r){let lines=[`【${r.title_ja||''}】`,`原題：${r.title_fr||''}`,`カテゴリ：${r.category||''}`,`基準総量：${r.base_total||inferBaseTotal(r)||''}g`, r.target_total?`作りたい量：${r.target_total}g（倍率 ${fmtNum(getMultiplier(r))}倍）`:'','', '■ 材料'];(r.ingredients||[]).forEach(x=>lines.push(`・${x.name_ja||x.name_fr||''}　基準量:${x.qty||''}${x.unit||''}${r.target_total?` → 必要量:${calcNeed(x,r)}${x.unit||''}`:''}${x.status?`（${x.status}）`:''}`));lines.push('','■ 作り方',r.process_ja||'');return lines.join('\\n');}
function formatFr(r){let lines=[`【${r.title_fr||''}】`,`Titre japonais：${r.title_ja||''}`,`Quantité de base：${r.base_total||inferBaseTotal(r)||''}g`, r.target_total?`Quantité cible：${r.target_total}g / x${fmtNum(getMultiplier(r))}`:'','', '■ Ingrédients'];(r.ingredients||[]).forEach(x=>lines.push(`・${x.name_fr||x.name_ja||''}　Base:${x.qty||''}${x.unit||''}${r.target_total?` → Nécessaire:${calcNeed(x,r)}${x.unit||''}`:''}`));lines.push('','■ Procédé',r.process_fr||'');return lines.join('\\n');}
function exportJson(){saveCurrent(false);download('aya_recipe_edited_v6.json',JSON.stringify(records,null,2),'application/json');}
function exportCsv(){saveCurrent(false);let rows=[['RecipeNo','TitleJA','TitleFR','Category','BaseTotalG','TargetTotalG','Multiplier','LineNo','Section','IngredientJA','IngredientFR','BaseQty','Unit','CalculatedQty','Status','OCRLine','Memo']];records.forEach(r=>(r.ingredients||[]).forEach((x,i)=>rows.push([r.no,r.title_ja,r.title_fr,r.category,r.base_total||inferBaseTotal(r)||'',r.target_total||'',r.multiplier||fmtNum(getMultiplier(r)),i+1,x.section,x.name_ja,x.name_fr,x.qty,x.unit,calcNeed(x,r),x.status,x.ocr_line,x.memo])));let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\n');download('aya_recipe_edited_v6.csv','﻿'+csv,'text/csv');}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function recipeHtml(r, includeImage=true){const base=r.base_total||inferBaseTotal(r)||'';const target=r.target_total||'';const mult=(target||r.multiplier)?fmtNum(getMultiplier(r)):'';const ing=(r.ingredients||[]).map(x=>`<tr><td>${esc(x.section||'')}</td><td>${esc(x.name_ja||'')}</td><td>${esc(x.name_fr||'')}</td><td>${esc(x.qty||'')}</td><td>${esc(x.unit||'')}</td><td>${esc(target?calcNeed(x,r):'')}</td><td>${esc(x.status||'')}</td></tr>`).join('');return `<section class="recipe"><h1>${esc(r.title_ja||'')}</h1><div class="subtitle">${esc(r.title_fr||'')} / ${esc(r.category||'')}</div><div class="subtitle">基準総量：${esc(base)}g ${target?` / 作りたい量：${esc(target)}g / 倍率：${esc(mult)}倍`:''}</div>${includeImage&&r.image?`<img class="photo" src="${esc(r.image)}">`:''}<h2>材料</h2><table><thead><tr><th>区分</th><th>材料JP</th><th>材料FR</th><th>基準量</th><th>単位</th><th>必要量</th><th>確認</th></tr></thead><tbody>${ing||'<tr><td colspan="7">材料未入力</td></tr>'}</tbody></table><h2>作り方（日本語）</h2><pre>${esc(r.process_ja||'')}</pre><h2>Procédé（français）</h2><pre>${esc(r.process_fr||'')}</pre><p class="memo">${esc(r.memo||'')}</p></section>`;}
function printCss(){return `<style>body{font-family:"Yu Gothic",Meiryo,sans-serif;margin:24px;color:#222}.recipe{page-break-after:always;margin-bottom:28px}h1{font-size:24px;border-bottom:2px solid #8b5e34;padding-bottom:6px}.subtitle{color:#666;margin:6px 0 14px}.photo{max-width:45%;max-height:520px;float:right;margin:0 0 12px 16px;border:1px solid #ccc}table{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:12px}th,td{border:1px solid #999;padding:5px;vertical-align:top}th{background:#f3eadf}pre{white-space:pre-wrap;font-family:inherit;line-height:1.6}h2{font-size:16px;margin-top:18px}.memo{color:#666}@media print{button{display:none}.recipe{break-after:page}}</style>`;}
function openPrintWindow(title, body){const w=window.open('','_blank');if(!w){alert('ポップアップがブロックされました。ブラウザの設定で許可してください。');return;}w.document.open();w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>${printCss()}</head><body><button onclick="window.print()" style="position:fixed;right:20px;top:20px;padding:10px 14px">PDFに保存/印刷</button>${body}</body></html>`);w.document.close();setTimeout(()=>w.focus(),300);}
function printOnePdf(r){openPrintWindow('recipe_'+(r.no||''), recipeHtml(r,true));}
function printAllPdf(){const ok=confirm('全件PDF出力用の印刷画面を開きます。件数が多いため表示に少し時間がかかる場合があります。続行しますか？');if(!ok)return;openPrintWindow('aya_recipe_all', records.map(r=>recipeHtml(r,false)).join(''));}

function normText(s){return String(s||'').toLowerCase().normalize('NFKC').replace(/[\s\u3000・,，.。;；:：()（）\[\]【】"'’`´]/g,'');}
function masterTokens(m){return [m.name_ja,m.name_fr,m.category,m.aliases].join(' ');}
function ingredientTokens(x){return [x.name_ja,x.name_fr,x.ocr_line,x.memo].join(' ');}
function uniqueArray(arr){const seen=new Set();const out=[];for(const v of arr){const s=String(v||'').trim();if(!s)continue;const k=normText(s);if(!seen.has(k)){seen.add(k);out.push(s);}}return out;}
function buildMaterialMasterFromRecords(){const map=new Map();records.forEach(r=>(r.ingredients||[]).forEach(x=>{const ja=(x.name_ja||'').trim();const fr=(x.name_fr||'').trim();if(!ja&&!fr)return;const key=normText(ja||fr);if(!key||key==='合計重量加熱減量後'||key.includes('poidstotal'))return;if(!map.has(key)){map.set(key,{id:'M'+String(map.size+1).padStart(4,'0'),name_ja:ja,name_fr:fr,category:'',aliases:uniqueArray([ja,fr]).join(', '),memo:'自動抽出'});}else{const m=map.get(key);m.name_ja=m.name_ja||ja;m.name_fr=m.name_fr||fr;m.aliases=uniqueArray((m.aliases||'').split(',').concat([ja,fr])).join(', ');}}));return Array.from(map.values()).sort((a,b)=>(a.name_ja||a.name_fr).localeCompare(b.name_ja||b.name_fr,'ja'));}
function loadMaterialMaster(){try{const saved=localStorage.getItem(MATERIAL_MASTER_KEY);materialMaster=saved?JSON.parse(saved):buildMaterialMasterFromRecords();if(!saved)localStorage.setItem(MATERIAL_MASTER_KEY,JSON.stringify(materialMaster));}catch(e){console.warn(e);materialMaster=buildMaterialMasterFromRecords();}}
function saveMaterialMaster(){localStorage.setItem(MATERIAL_MASTER_KEY,JSON.stringify(materialMaster));}
function findMatchingMasters(q){const nq=normText(q);if(!nq)return [];return materialMaster.filter(m=>normText(masterTokens(m)).includes(nq));}
function masterMatchesIngredient(m,x){const ing=normText(ingredientTokens(x));if(!ing)return false;const parts=uniqueArray([m.name_ja,m.name_fr].concat(String(m.aliases||'').split(','))).map(normText).filter(Boolean);return parts.some(p=>p && (ing.includes(p)||p.includes(ing)));}
function recordHasMaster(r,masters){if(!masters.length)return false;return (r.ingredients||[]).some(x=>masters.some(m=>masterMatchesIngredient(m,x)));}
function findBestMasterForIngredient(x){let best=null;let bestScore=0;for(const m of materialMaster){const parts=uniqueArray([m.name_ja,m.name_fr].concat(String(m.aliases||'').split(','))).map(normText).filter(Boolean);const ing=normText(ingredientTokens(x));let score=0;for(const p of parts){if(!p)continue;if(ing===p)score=Math.max(score,100);else if(ing.includes(p))score=Math.max(score,80+p.length/100);else if(p.includes(ing)&&ing.length>2)score=Math.max(score,50+ing.length/100);}if(score>bestScore){best=m;bestScore=score;}}return bestScore>=50?best:null;}
function masterLabelForIngredient(x){const m=findBestMasterForIngredient(x);return m?`${m.id} ${m.name_ja||m.name_fr}`:'';}
function applyMasterToIngredient(i){saveCurrent(false);const r=rec();if(!r||!r.ingredients||!r.ingredients[i])return;const x=r.ingredients[i];const m=findBestMasterForIngredient(x);if(!m){alert('一致する材料マスタが見つかりません。材料マスタに別名を追加してください。');return;}const oldJa=x.name_ja, oldFr=x.name_fr;x.name_ja=m.name_ja||x.name_ja;x.name_fr=m.name_fr||x.name_fr;x.memo=uniqueArray([x.memo,`マスタ適用: ${m.id} / 旧表記: ${oldJa} / ${oldFr}`]).join('\n');saveCurrent(false);renderTab();}
function normalizeCurrentRecipeMaterials(){saveCurrent(false);const r=rec();if(!r){alert('レシピを選択してください');return;}let count=0;(r.ingredients||[]).forEach(x=>{const m=findBestMasterForIngredient(x);if(m){const oldJa=x.name_ja,oldFr=x.name_fr;x.name_ja=m.name_ja||x.name_ja;x.name_fr=m.name_fr||x.name_fr;if((oldJa!==x.name_ja)||(oldFr!==x.name_fr))count++;}});localStorage.setItem(STORAGE_KEY,JSON.stringify(records));renderList();renderTab();alert(`材料マスタを ${count} 件適用しました。`);}
function bindMaterialModal(){const modal=$('#materialModal');$('#closeMasterBtn').onclick=()=>modal.style.display='none';$('#saveMasterBtn').onclick=()=>{collectMasterFromTable();saveMaterialMaster();renderList();alert('材料マスタを保存しました');};$('#addMasterRow').onclick=()=>{collectMasterFromTable();materialMaster.unshift({id:'M'+String(Date.now()).slice(-6),name_ja:'',name_fr:'',category:'',aliases:'',memo:''});renderMasterTable();};$('#masterQ').addEventListener('input',renderMasterTable);$('#exportMasterCsv').onclick=exportMasterCsv;$('#rebuildMasterBtn').onclick=()=>{if(confirm('現在のレシピ材料から材料マスタを再抽出します。既存マスタは上書きされます。よろしいですか？')){materialMaster=buildMaterialMasterFromRecords();saveMaterialMaster();renderMasterTable();renderList();}};modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none';});}
function openMaterialMaster(){saveCurrent(false);$('#materialModal').style.display='flex';renderMasterTable();}
function collectMasterFromTable(){document.querySelectorAll('[data-mi][data-mk]').forEach(el=>{const i=+el.dataset.mi,k=el.dataset.mk;if(materialMaster[i])materialMaster[i][k]=el.value;});}
function renderMasterTable(){const q=($('#masterQ')&&$('#masterQ').value||'').trim().toLowerCase();let rows='';let shown=0;materialMaster.forEach((m,i)=>{const hay=masterTokens(m).toLowerCase();if(q&&!hay.includes(q)&&!normText(hay).includes(normText(q)))return;shown++;rows+=`<tr><td><input data-mi="${i}" data-mk="id" value="${esc(m.id||'')}"></td><td><input data-mi="${i}" data-mk="name_ja" value="${esc(m.name_ja||'')}"></td><td><input data-mi="${i}" data-mk="name_fr" value="${esc(m.name_fr||'')}"></td><td><input data-mi="${i}" data-mk="category" value="${esc(m.category||'')}"></td><td><textarea data-mi="${i}" data-mk="aliases">${esc(m.aliases||'')}</textarea><div><span class="pill" onclick="searchByMaster(${i})">この材料で検索</span><span class="pill" onclick="addAliasToMaster(${i})">別名追加</span></div></td><td><textarea data-mi="${i}" data-mk="memo">${esc(m.memo||'')}</textarea></td><td><button class="btn small danger" onclick="deleteMaster(${i})">削除</button></td></tr>`;});$('#masterSummary').textContent=`表示 ${shown} / 全 ${materialMaster.length} 件`;$('#masterList').innerHTML=`<table class="master-table"><thead><tr><th>ID</th><th>材料JP 標準</th><th>材料FR 標準</th><th>カテゴリ</th><th>別名・OCRゆれ</th><th>メモ</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">該当なし</td></tr>'}</tbody></table>`;}
function searchByMaster(i){collectMasterFromTable();const m=materialMaster[i];if(!m)return;$('#q').value=m.name_ja||m.name_fr||String(m.aliases||'').split(',')[0]||'';$('#materialModal').style.display='none';renderList();}
function addAliasToMaster(i){collectMasterFromTable();const val=($('#newAlias')&&$('#newAlias').value||'').trim();if(!val){alert('上の「選択行に追加する別名」に入力してください。');return;}if(!materialMaster[i])return;materialMaster[i].aliases=uniqueArray(String(materialMaster[i].aliases||'').split(',').concat([val])).join(', ');$('#newAlias').value='';renderMasterTable();}
function deleteMaster(i){collectMasterFromTable();if(confirm('この材料マスタ行を削除しますか？')){materialMaster.splice(i,1);saveMaterialMaster();renderMasterTable();renderList();}}
function exportMasterCsv(){collectMasterFromTable();saveMaterialMaster();let rows=[['MaterialID','NameJA','NameFR','Category','Aliases','Memo']];materialMaster.forEach(m=>rows.push([m.id,m.name_ja,m.name_fr,m.category,m.aliases,m.memo]));let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('aya_recipe_material_master_v6.csv','﻿'+csv,'text/csv');}

document.addEventListener('DOMContentLoaded',init);
</script>
